<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="#c2185b"/>

  <!-- Body -->
  <rect x="12" y="20" width="8" height="7" rx="1" fill="#FDDBB4"/>
  <!-- Arms -->
  <rect x="9"  y="20" width="3" height="5" rx="1" fill="#FDDBB4"/>
  <rect x="20" y="20" width="3" height="5" rx="1" fill="#FDDBB4"/>
  <!-- Legs -->
  <rect x="12" y="27" width="3" height="4" rx="1" fill="#FDDBB4"/>
  <rect x="17" y="27" width="3" height="4" rx="1" fill="#FDDBB4"/>

  <!-- Top -->
  <rect x="12" y="20" width="8" height="6" rx="1" fill="#E91E63"/>
  <rect x="9"  y="20" width="3" height="4" rx="1" fill="#E91E63"/>
  <rect x="20" y="20" width="3" height="4" rx="1" fill="#E91E63"/>

  <!-- Skirt -->
  <rect x="11" y="25" width="10" height="5" rx="2" fill="#9C27B0"/>

  <!-- Neck -->
  <rect x="14" y="17" width="4" height="3" fill="#FDDBB4"/>

  <!-- Head -->
  <ellipse cx="16" cy="13" rx="7" ry="7" fill="#FDDBB4"/>

  <!-- Hair -->
  <ellipse cx="16" cy="8"  rx="7" ry="5" fill="#1a1a1a"/>
  <ellipse cx="16" cy="6"  rx="4" ry="4" fill="#1a1a1a"/>
  <rect x="9"  y="9" width="2" height="5" rx="1" fill="#1a1a1a"/>
  <rect x="21" y="9" width="2" height="5" rx="1" fill="#1a1a1a"/>

  <!-- Eyes -->
  <rect x="12" y="12" width="3" height="3" rx="1" fill="white"/>
  <rect x="17" y="12" width="3" height="3" rx="1" fill="white"/>
  <rect x="13" y="13" width="2" height="2" rx="0.5" fill="#1a3a5c"/>
  <rect x="18" y="13" width="2" height="2" rx="0.5" fill="#1a3a5c"/>
  <!-- Eye highlights -->
  <rect x="13" y="13" width="1" height="1" fill="white"/>
  <rect x="18" y="13" width="1" height="1" fill="white"/>

  <!-- Smile -->
  <path d="M13 18 Q16 20 19 18" stroke="#c97a8a" stroke-width="1" fill="none" stroke-linecap="round"/>

  <!-- Crown -->
  <polygon points="11,8 12,5 14,7 16,4 18,7 20,5 21,8" fill="#F5C518"/>
  <rect x="11" y="7" width="10" height="2" rx="0.5" fill="#F5C518"/>
  <rect x="14" y="7" width="2" height="2" fill="#E74C3C"/>
</svg>
